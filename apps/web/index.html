<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4f4" />
    <meta name="description" content="Pay or get paid with a 6-digit code. BLIK-style NIM payments inside Nimiq Pay." />
    <meta name="application-name" content="NIMble" />
    <meta property="og:title" content="NIMble" />
    <meta property="og:description" content="Pay or get paid with a 6-digit code." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta property="og:image" content="https://nimble.gallareton.pl/icon-512.png" />
    <meta property="og:site_name" content="NIMble" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>NIMBLE</title>
  </head>
  <body>
    <!-- Painted from the HTML itself, before the bundle is parsed and long
         before the network is probed. React replaces it on mount. Without
         this the app showed a blank page for as long as wallet consensus
         took to settle. -->
    <style>
      body { margin: 0; background: #f4f4f4; }
      #boot {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1f2348;
      }
      #boot .brand { font-weight: 800; font-size: 28px; letter-spacing: -0.02em; color: #e9b213; }
      #boot .brand em { font-style: normal; color: #0582ca; }
      #boot svg { color: #0582ca; animation: boot-spin 1.1s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot svg { animation: none; } }
    </style>
    <div id="root">
      <div id="boot">
        <div class="brand">NIM<em>BLE</em></div>
        <svg viewBox="0 0 12 12" width="22" height="22" aria-label="Loading" role="img">
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.667">
            <path d="M6 1a5 5 0 015 5" />
            <path d="M3.038 2A4.96 4.96 0 001 6.014 4.985 4.985 0 005.986 11c1.652 0 3.11-.804 4.014-2.038" opacity=".3" />
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
